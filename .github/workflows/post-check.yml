name: Post Check

# The watchdog. Replaces the 4 PM browser check: it needs no computer and no browser.
# It asks Instagram whether today's card (and, on Saturday, the recap Reel) is up. If not, the run FAILS, and GitHub
# emails the repo owner about a failed workflow. Reads only; never posts.
# Cron is early because GitHub runs scheduled workflows several hours late: 22:00 UTC (6 PM Eastern) lands in the evening.

on:
  schedule:
    - cron: '0 22 * * 1,2,3,4,5,6'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Is today's post up
        env:
          META_PAGE_TOKEN:  ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID:  ${{ secrets.META_IG_USER_ID }}
        run: node scripts/post-check.js
